<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Terminal de marcacion de puntos de control, bitacora y reportes de cumplimiento para rondas de vigilancia.">
<meta name="theme-color" content="#1B2E45">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ronda Vigia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:#EAEDF1}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body><title>Ronda Vigía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EAEDF1; --surface:#FFFFFF; --surface-2:#F4F6F9; --surface-3:#E7EBF0;
  --ink:#141B23; --ink-2:#3E4A57; --muted:#6B7887;
  --line:#D3D9E0; --line-strong:#B4BEC9;
  --navy:#1B2E45; --navy-2:#24405E; --on-navy:#E9EEF4;
  --hv:#E3C400; --on-hv:#17190C; --hv-soft:#FAF2C2; --hv-line:#C9AD00;
  --ok:#12674A; --ok-bg:#DCEFE6; --ok-line:#9CCDB8;
  --warn:#8A5600; --warn-bg:#F7E9CD; --warn-line:#DDBE83;
  --bad:#A02A1F; --bad-bg:#F8DFDC; --bad-line:#E3AEA7;
  --chart:#2C4F73; --chart-soft:#CBD8E5;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(20,27,35,.05), 0 10px 28px -20px rgba(20,27,35,.45);
  --focus:#2C6FB5;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D131A; --surface:#161E27; --surface-2:#1C2733; --surface-3:#22303E;
    --ink:#E7ECF2; --ink-2:#B5C1CE; --muted:#8593A3;
    --line:#293544; --line-strong:#3B4C60;
    --navy:#0F1A25; --navy-2:#17293B; --on-navy:#E7ECF2;
    --hv:#E3C400; --on-hv:#17190C; --hv-soft:#38320D; --hv-line:#6E6210;
    --ok:#5DC99C; --ok-bg:#10352A; --ok-line:#1F5C48;
    --warn:#E2A93F; --warn-bg:#372B10; --warn-line:#6A521C;
    --bad:#F28C80; --bad-bg:#391A17; --bad-line:#6B322B;
    --chart:#7FA8D0; --chart-soft:#22374C;
    --focus:#7FB3E8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0D131A; --surface:#161E27; --surface-2:#1C2733; --surface-3:#22303E;
  --ink:#E7ECF2; --ink-2:#B5C1CE; --muted:#8593A3;
  --line:#293544; --line-strong:#3B4C60;
  --navy:#0F1A25; --navy-2:#17293B; --on-navy:#E7ECF2;
  --hv:#E3C400; --on-hv:#17190C; --hv-soft:#38320D; --hv-line:#6E6210;
  --ok:#5DC99C; --ok-bg:#10352A; --ok-line:#1F5C48;
  --warn:#E2A93F; --warn-bg:#372B10; --warn-line:#6A521C;
  --bad:#F28C80; --bad-bg:#391A17; --bad-line:#6B322B;
  --chart:#7FA8D0; --chart-soft:#22374C;
  --focus:#7FB3E8;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Barlow","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:"Barlow Condensed",Haettenschweiler,"Arial Narrow",sans-serif;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- topbar ---------- */
.topbar{background:var(--navy);color:var(--on-navy);border-bottom:3px solid var(--hv)}
.topbar-in{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{display:block}
.brand-name{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:23px;letter-spacing:.06em;text-transform:uppercase;line-height:1}
.brand-sub{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9DB0C4;line-height:1;margin-top:3px}
.sitio{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#A9BACC;border-left:1px solid #33475D;padding-left:16px}
.clock{font-size:21px;font-weight:500;letter-spacing:.02em}
.clock small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9DB0C4;font-family:"Barlow",sans-serif}
.link-state{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:5px 9px;border-radius:999px;border:1px solid #33475D;color:#B6C6D6}
.dot{width:7px;height:7px;border-radius:50%;background:#6EC79E}
.dot.local{background:var(--hv)}

/* ---------- tabs ---------- */
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:2px;overflow-x:auto}
.tab{appearance:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);
  font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:14px 16px 11px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hv)}
.tab .badge{margin-left:7px}

/* ---------- layout ---------- */
main{max-width:1240px;margin:0 auto;padding:24px 20px 72px}
.view[hidden]{display:none}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-hd{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-hd h2{font-size:19px;letter-spacing:.05em;text-transform:uppercase}
.panel-hd .spacer{margin-left:auto}
.panel-bd{padding:18px}
.panel-bd.tight{padding:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* ---------- buttons / fields ---------- */
button{font-family:inherit}
.btn{appearance:none;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  border-radius:var(--r-sm);padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;
  align-items:center;gap:7px;line-height:1.2;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-hv{background:var(--hv);border-color:var(--hv-line);color:var(--on-hv)}
.btn-hv:hover{background:#F0D200;border-color:var(--hv-line)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn-navy:hover{background:var(--navy-2);border-color:var(--navy-2)}
.btn-lg{padding:12px 20px;font-size:16px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.btn-sm{padding:5px 9px;font-size:13px}
.btn-danger{color:var(--bad);border-color:var(--bad-line)}
.btn-danger:hover{background:var(--bad-bg)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input[type="checkbox"]{width:auto;accent-color:var(--navy)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 160px;min-width:0}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.chip.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.chip.hv{background:var(--hv-soft);border-color:var(--hv-line);color:var(--ink)}
.badge{display:inline-block;min-width:19px;text-align:center;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--surface-3);color:var(--ink-2)}
.badge.alert{background:var(--bad-bg);color:var(--bad)}

/* ---------- ronda activa ---------- */
.activa{border-left:5px solid var(--hv)}
.activa-hd{display:flex;gap:16px;align-items:flex-start;padding:16px 18px;background:var(--hv-soft);border-bottom:1px solid var(--hv-line);flex-wrap:wrap}
.activa-hd h2{font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.activa-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:5px;font-size:13.5px;color:var(--ink-2)}
.activa-meta b{color:var(--ink);font-weight:600}
.timer{margin-left:auto;text-align:right}
.timer .t{font-size:30px;font-weight:600;line-height:1;letter-spacing:-.01em}
.progress{height:8px;background:var(--surface-3);border-radius:999px;overflow:hidden;margin-top:12px;width:100%}
.progress i{display:block;height:100%;background:var(--hv);border-radius:999px;transition:width .3s}

.scan{display:flex;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
.scan label.f{flex:1 1 240px}
.scan input{font-family:"IBM Plex Mono",monospace;font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:11px 13px;font-weight:500}

/* ---------- lista de puntos ---------- */
.pts{list-style:none;margin:0;padding:0}
.pt{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line)}
.pt:last-child{border-bottom:0}
.pt.next{background:var(--surface-2);box-shadow:inset 4px 0 0 var(--hv)}
.pt-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;
  border:1.5px solid var(--line-strong);color:var(--muted);background:var(--surface)}
.pt.done .pt-n{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.pt.next .pt-n{border-color:var(--hv-line);background:var(--hv);color:var(--on-hv)}
.pt-nom{font-weight:600;font-size:15.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pt-sub{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.pt-code{font-family:"IBM Plex Mono",monospace;font-size:12.5px;letter-spacing:.08em;color:var(--ink-2);background:var(--surface-3);padding:1px 6px;border-radius:4px}
.pt-act{display:flex;align-items:center;gap:10px;justify-self:end;text-align:right}
.pt-hora{font-size:17px;font-weight:500;line-height:1.1}
.pt-nota{grid-column:2 / -1;font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-left:3px solid var(--line-strong);
  padding:7px 11px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-top:4px}
.pt-nota.novedad{border-left-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
@media (max-width:620px){
  .pt{grid-template-columns:34px minmax(0,1fr);row-gap:8px}
  .pt-act{grid-column:2;justify-self:start;text-align:left}
}

/* ---------- tablas ---------- */
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:19px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-2);margin-bottom:5px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-size:33px;font-weight:600;line-height:1.05;letter-spacing:-.015em;font-family:"IBM Plex Mono",monospace}
.kpi .l{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:3px}
.kpi.alerta .v{color:var(--bad)}

/* ---------- chart ---------- */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
.bar{fill:var(--chart)}
.bar-bg{fill:var(--chart-soft)}
.gridline{stroke:var(--line);stroke-width:1}
.axis-t{fill:var(--muted);font-size:11px;font-family:"IBM Plex Mono",monospace}
.hit{fill:transparent;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--on-navy);border-radius:var(--r-sm);
  padding:7px 10px;font-size:12.5px;line-height:1.35;box-shadow:var(--shadow);transform:translate(-50%,-115%);white-space:nowrap;opacity:0;transition:opacity .1s}
.tip b{font-family:"IBM Plex Mono",monospace;font-weight:600}
.meter{height:7px;border-radius:999px;background:var(--chart-soft);overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--chart);border-radius:999px}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line-strong);border-radius:var(--r);padding:0;background:var(--surface);color:var(--ink);
  max-width:520px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,16,22,.55)}
.dlg-hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg-hd h3{font-size:20px;letter-spacing:.05em;text-transform:uppercase}
.dlg-bd{padding:18px;display:flex;flex-direction:column;gap:14px;max-height:64vh;overflow-y:auto}
.dlg-ft{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);color:var(--ink-2);padding:10px 8px;font-size:14px;font-weight:600;cursor:pointer}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.seg button.nov[aria-pressed="true"]{background:var(--bad);color:#fff}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160%);z-index:60;
  background:var(--navy);color:var(--on-navy);padding:11px 18px;border-radius:999px;box-shadow:var(--shadow);
  font-size:14.5px;font-weight:500;transition:transform .25s;max-width:calc(100% - 32px)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--bad);color:#fff}
#toast.hv{background:var(--hv);color:var(--on-hv)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.filters label.f{flex:0 1 170px}
.filters .chk{flex-direction:row;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:20px;align-items:start}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2)}
.pick input[type="number"]{width:80px;flex:none}
.pick select{flex:1;min-width:0;font-size:14px}
.pick .nm{flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere}
.pick .nm small{display:block;margin-top:2px;color:var(--muted);font-size:12px;line-height:1.45;
  font-family:"IBM Plex Mono",ui-monospace,monospace;overflow-wrap:anywhere}
.pick{align-items:flex-start}
.pick .ord{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;
  font-weight:600;background:var(--navy);color:var(--on-navy);font-variant-numeric:tabular-nums}
.pick .x{flex:none;padding:5px 10px;font-size:16px;line-height:1;color:var(--bad);border-color:var(--bad-line)}
.pick .x:hover{background:var(--bad-bg)}

/* ---------- cámara y lector QR ---------- */
.scan .btn-qr{flex:0 0 auto;padding:11px 16px}
.lector{position:relative;background:#000;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:1/1;max-height:58vh}
.lector video{width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;inset:14%;border:3px solid var(--hv);border-radius:12px;box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
.mira::before,.mira::after{content:"";position:absolute;left:-3px;right:-3px;height:3px;background:var(--hv);opacity:.55}
.mira::before{top:50%}
.lector-msg{position:absolute;left:0;right:0;bottom:0;padding:9px 12px;background:rgba(10,16,22,.78);color:#E9EEF4;
  font-size:13px;text-align:center}

/* ---------- fotos ---------- */
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.foto-mini{position:relative;width:64px;height:64px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-strong);
  background:var(--surface-2);flex:none;padding:0;cursor:pointer}
.foto-mini img{width:100%;height:100%;object-fit:cover;display:block}
.foto-mini .quita{position:absolute;top:2px;right:2px;width:19px;height:19px;border:0;border-radius:50%;
  background:rgba(10,16,22,.75);color:#fff;font-size:13px;line-height:1;cursor:pointer;padding:0}
.pt-fotos{grid-column:2 / -1;margin-top:6px}
.visor{position:fixed;inset:0;z-index:70;background:rgba(8,12,17,.93);display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px}
.visor img{max-width:100%;max-height:100%;margin:auto;display:block;border-radius:var(--r-sm)}
.visor-hd,.visor-ft{display:flex;gap:9px;align-items:center;flex-wrap:wrap;color:#E9EEF4;font-size:13.5px}
.visor-ft{justify-content:center}
.geo{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.geo a{color:var(--focus)}

/* ---------- pantalla de acceso ---------- */
#acceso{position:fixed;inset:0;z-index:80;background:var(--navy);display:grid;place-items:center;padding:22px;overflow-y:auto}
#acceso[hidden]{display:none}
.acceso-caja{width:100%;max-width:390px;background:var(--surface);border-radius:var(--r);padding:24px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.acceso-marca{display:flex;align-items:center;gap:12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.acceso-marca .brand-name{color:var(--ink);font-size:21px}
.acceso-marca .brand-sub{color:var(--muted)}

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byId = (arr, id) => arr.find(x => x.id === id) || null;

const HORA = new Intl.DateTimeFormat("es-CL", { hour: "2-digit", minute: "2-digit", hour12: false });
const HMS = new Intl.DateTimeFormat("es-CL", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
const FECHA = new Intl.DateTimeFormat("es-CL", { weekday: "long", day: "2-digit", month: "long", year: "numeric" });
const FCORTA = new Intl.DateTimeFormat("es-CL", { day: "2-digit", month: "2-digit", year: "2-digit" });
const fmtHora = (iso) => iso ? HORA.format(new Date(iso)) : "—";
const fmtFC = (iso) => iso ? FCORTA.format(new Date(iso)) : "—";
const diaKey = (d) => { const x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
const hoyKey = () => diaKey(new Date());
const minutos = (a, b) => Math.round((new Date(b) - new Date(a)) / 60000);
const pct = (n, d) => d > 0 ? Math.round((n / d) * 100) : 0;

/* ---------------- estados de marca ---------------- */

const chipEstado = (e) => {

};

/* Los datos creados antes de que existieran las instalaciones no tienen a cuál
   pertenecen. Se crea una con el nombre del sitio y se les asigna. */
async function migrar() {
  if (state.migrado || !state.resuelto) return;
  const huerfanos = ["puntos", "rutas", "rondas"].some(c => state[c].some(d => !d.instalacionId)) ||
                    state.guardias.some(g => !g.instalaciones);
  if (!state.instalaciones.length && !huerfanos) return;   /* instalación vacía y sin datos previos */
  state.migrado = true;

  let prim = state.instalaciones[0];
  if (!prim) {
    prim = { id: uid("ins"), nombre: (state.sitio && state.sitio.nombre) || "Instalación principal",
             cliente: "", direccion: "", activa: true };
    await guardar("instalaciones", prim);
  }
  for (const col of ["puntos", "rutas", "rondas"]) {
    for (const d of state[col].slice()) {
      if (!d.instalacionId) await guardar(col, Object.assign({}, d, { instalacionId: prim.id }));
    }
  }
  for (const g of state.guardias.slice()) {
    if (!g.instalaciones) await guardar("guardias", Object.assign({}, g, { instalaciones: [prim.id] }));
  }
}

/* ---------------- estado ---------------- */
const COLS = ["instalaciones", "usuarios", "guardias", "puntos", "rutas", "rondas"];
const state = {
  instalaciones: [], usuarios: [], guardias: [], puntos: [], rutas: [], rondas: [],
  sitio: { nombre: "Instalación" },
  vista: "ronda",
  backend: "local",
  resuelto: false,
  localDirty: false,
  migrado: false,
  sesion: null,          /* usuario con sesión iniciada */
  instalacionId: "",     /* instalación que se está mirando */
  filtros: { dias: "7", guardia: "", ruta: "", soloNovedades: false },
  repDias: 14
};

/* ================= CUENTAS Y ROLES =================
   Aviso honesto: esto separa vistas y evita errores, NO es seguridad. Todo
   corre en el navegador, así que un usuario decidido puede saltárselo. Para
   claves de verdad hace falta un servidor que valide del otro lado. */
const ROLES = {
  admin:   { txt: "Administrador", cls: "hv"   },
  guardia: { txt: "Guardia",       cls: ""     },
  cliente: { txt: "Cliente",       cls: "ok"   }
};

const SESION_K = "ronda_vigia_sesion";

async function hashClave(clave, sal) {
  try {
    if (crypto && crypto.subtle) {
      const enc = new TextEncoder();
      const k = await crypto.subtle.importKey("raw", enc.encode(clave), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: enc.encode(sal), iterations: 120000, hash: "SHA-256" }, k, 256);
      return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, "0")).join("");
    }
  } catch (e) { /* sin WebCrypto (por ejemplo abriendo el archivo suelto) */ }
  let h = 0;
  const s = sal + "|" + clave;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
  return "d" + (h >>> 0).toString(16);
}

const normUsuario = u => String(u || "").trim().toLowerCase();
const usuarioPorNombre = u => state.usuarios.find(x => normUsuario(x.usuario) === normUsuario(u)) || null;

async function crearUsuario(datos, clave) {
  const sal = uid("s");
  return Object.assign({ id: datos.id || uid("u"), sal, hash: await hashClave(clave, sal) }, datos);
}

async function verificarClave(usuario, clave) {
  if (!usuario || !usuario.sal) return false;
  return (await hashClave(clave, usuario.sal)) === usuario.hash;
}

function abrirSesion(u) {
  state.sesion = u;
  try { localStorage.setItem(SESION_K, u.id); } catch (e) {}
  const permitidas = instalacionesDe(u);
  state.instalacionId = permitidas.length ? permitidas[0].id : "";
  state.vista = u.rol === "guardia" ? "ronda" : (u.rol === "cliente" ? "reportes" : "ronda");
  render();
}

function cerrarSesion() {
  state.sesion = null;
  try { localStorage.removeItem(SESION_K); } catch (e) {}
  render();
}

function recuperarSesion() {
  let id = null;
  try { id = localStorage.getItem(SESION_K); } catch (e) {}
  if (!id) return;
  const u = byId(state.usuarios, id);
  if (u && u.activo !== false) {
    state.sesion = u;
    const permitidas = instalacionesDe(u);
    if (!state.instalacionId || !permitidas.some(i => i.id === state.instalacionId)) {
      state.instalacionId = permitidas.length ? permitidas[0].id : "";
    }
    if (u.rol === "cliente" && state.vista === "ronda") state.vista = "reportes";
  }
}

const rol = () => state.sesion ? state.sesion.rol : null;
const esAdmin = () => rol() === "admin";
const esGuardia = () => rol() === "guardia";
const esCliente = () => rol() === "cliente";

/* Qué instalaciones puede ver quien tiene la sesión abierta. */
function instalacionesDe(u) {
  const act = state.instalaciones.filter(i => i.activa !== false);
  if (!u) return [];
  if (u.rol === "admin") return act;
  const ids = u.instalaciones || [];
  return act.filter(i => ids.includes(i.id));
}
/* Nunca se filtra por state.instalacionId a secas: si apunta a una instalación
   que la sesión no tiene asignada (valor obsoleto, error de código), se cae a la
   primera permitida. Así un cliente no puede terminar viendo otra instalación. */
function instalacionEfectiva() {
  const permitidas = instalacionesDe(state.sesion);
  if (!permitidas.length) return "␀ninguna";
  return permitidas.some(i => i.id === state.instalacionId) ? state.instalacionId : permitidas[0].id;
}
const instalacionActual = () => byId(state.instalaciones, instalacionEfectiva());

/* Filtros por instalación: todas las vistas trabajan sobre la activa. */
const puntosVis = () => { const i = instalacionEfectiva(); return state.puntos.filter(p => p.instalacionId === i); };
const rutasVis = () => { const i = instalacionEfectiva(); return state.rutas.filter(r => r.instalacionId === i); };
const guardiasVis = () => { const i = instalacionEfectiva(); return state.guardias.filter(g => (g.instalaciones || []).includes(i)); };

/* El guardia ve sólo sus propias rondas; el admin y el cliente, todas las de la instalación. */
const miGuardiaId = () => (state.sesion && state.sesion.rol === "guardia") ? (state.sesion.guardiaId || "") : "";
const rondasVis = () => {
  const i = instalacionEfectiva();
  return state.rondas.filter(r => r.instalacionId === i && (!esGuardia() || r.guardiaId === miGuardiaId()));
};
let DB = null;
let DOWN = null;

/* ---------------- persistencia ---------------- */
const LSK = "ronda_vigia_v1";

function cargarLocal() {
  try {
    const raw = localStorage.getItem(LSK);
    if (raw) {
      const d = JSON.parse(raw);
      COLS.forEach(c => { if (Array.isArray(d[c])) state[c] = d[c]; });
      if (d.sitio) state.sitio = d.sitio;
      return true;
    }
  } catch (e) { /* almacenamiento no disponible */ }
  const ej = datosEjemplo();
  COLS.forEach(c => state[c] = ej[c]);
  state.sitio = ej.sitio;
  return false;
}

function guardarLocal() {
  try {
    const d = { sitio: state.sitio };
    COLS.forEach(c => d[c] = state[c]);
    localStorage.setItem(LSK, JSON.stringify(d));
  } catch (e) { /* modo privado: se mantiene sólo en memoria */ }
}

async function guardar(col, obj) {
  const copia = JSON.parse(JSON.stringify(obj));
  const i = state[col].findIndex(x => x.id === copia.id);
  if (i >= 0) state[col][i] = copia; else state[col].push(copia);
  if (DB) {
    const body = Object.assign({}, copia); delete body.id;
    try { await DB.collection(col).doc(copia.id).set(body); }
    catch (e) { avisar(errTxt(e), "bad"); }
  } else { state.localDirty = true; guardarLocal(); }
  render();
}

async function borrar(col, id) {
  state[col] = state[col].filter(x => x.id !== id);
  if (DB) { try { await DB.collection(col).doc(id).delete(); } catch (e) { avisar(errTxt(e), "bad"); } }
  else { state.localDirty = true; guardarLocal(); }
  render();
}

async function guardarSitio(nombre) {
  state.sitio = { nombre };
  if (DB) { try { await DB.doc("config/sitio").set({ nombre }); } catch (e) { avisar(errTxt(e), "bad"); } }
  else { state.localDirty = true; guardarLocal(); }
  render();
}

function errTxt(e) {
  const c = e && e.code;
  if (c === "quota_exceeded") return "El registro está lleno. Archiva rondas antiguas para seguir registrando.";
  if (c === "resource_exhausted") return "Demasiadas operaciones seguidas. Espera unos segundos e intenta de nuevo.";
  if (c === "invalid_argument") return "El registro rechazó el dato. Revisa los campos e intenta de nuevo.";
  if (c === "revoked") return "Se perdió el acceso al registro compartido. Recarga la página.";
  return "No se pudo guardar en el registro compartido. Reintenta en un momento.";
}

async function conectar() {
  let db = null;
  try { db = window.claude && claude.use ? await claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { state.resuelto = true; marcarLink(); render(); return; }

  DB = db;
  state.backend = "db";
  if (!state.localDirty) COLS.forEach(c => state[c] = []);
  state.resuelto = true;
  marcarLink();

  COLS.forEach(col => {
    DB.collection(col).onSnapshot(
      snap => {
        state[col] = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        render();
      },
      e => { avisar(errTxt(e), "bad"); }
    );
  });
  DB.doc("config/sitio").onSnapshot(
    s => { if (s.exists) { state.sitio = s.data(); render(); } },
    () => {}
  );
  try { DOWN = await claude.use("downloads"); } catch (e) { DOWN = null; }
  render();
}

function marcarLink() {
  const dot = $("#linkDot"), txt = $("#linkTxt");
  if (state.backend === "db") { dot.classList.remove("local"); txt.textContent = "Registro compartido"; }
  else { dot.classList.add("local"); txt.textContent = "Sólo este equipo"; }
}

/* ---------------- dominio ---------------- */
const rondaActiva = () => rondasVis().find(r => r.estado === "en_curso") || null;

function puntosDeRuta(ruta) {
  if (!ruta) return [];
  return (ruta.puntos || []).map((rp, i) => {
    const p = byId(state.puntos, rp.puntoId);
    return { idx: i, puntoId: rp.puntoId, minuto: rp.minuto,
             codigo: p ? p.codigo : "??", nombre: p ? p.nombre : "Punto eliminado", zona: p ? p.zona : "—" };
  });
}

function estadoMarca(ronda, minutoEsperado, horaIso, tolerancia) {
  const desfase = minutos(ronda.inicio, horaIso) - minutoEsperado;
  let estado = "a_tiempo";
  if (desfase > tolerancia) estado = "retrasado";
  else if (desfase < -tolerancia) estado = "anticipado";
  return { estado, desfase };
}

function marcasDe(ronda) { return ronda.marcas || []; }
function marcaEnIdx(ronda, idx) { return marcasDe(ronda).find(m => m.idx === idx) || null; }

function proximoIdx(ronda, ruta) {
  const pts = puntosDeRuta(ruta);
  for (const p of pts) if (!marcaEnIdx(ronda, p.idx)) return p.idx;
  return -1;
}

function resumenRonda(r) {
  const total = r.totalPuntos || puntosDeRuta(byId(state.rutas, r.rutaId)).length;
  const ms = marcasDe(r);
  const aTiempo = ms.filter(m => m.estado === "a_tiempo").length;
  const fuera = ms.filter(m => m.estado === "retrasado" || m.estado === "anticipado").length;
  const novedades = ms.filter(m => m.novedad).length;
  const omitidos = r.estado === "finalizada" ? Math.max(0, total - ms.length) : 0;
  return { total, marcadas: ms.length, aTiempo, fuera, novedades, omitidos };
}

/* filas planas de la bitácora, más recientes primero */
function bitacora() {
  const filas = [];
  rondasVis().forEach(r => {
    const ruta = byId(state.rutas, r.rutaId);
    const g = byId(state.guardias, r.guardiaId);
    const pts = puntosDeRuta(ruta);
    marcasDe(r).forEach(m => {
      filas.push({ rondaId: r.id, hora: m.hora, ruta: r.rutaNombre || (ruta ? ruta.nombre : "—"),
        guardia: r.guardiaNombre || (g ? g.nombre : "—"), guardiaId: r.guardiaId, rutaId: r.rutaId,
        punto: m.nombre, codigo: m.codigo, zona: m.zona, estado: m.estado, desfase: m.desfase,
        metodo: m.metodo, novedad: !!m.novedad, nota: m.nota || "",
        geo: m.geo || null, coords: m.coords || null, fotos: m.fotos || [] });
    });
    if (r.estado === "finalizada") {
      pts.forEach(p => {
        if (!marcaEnIdx(r, p.idx)) {
          filas.push({ rondaId: r.id, hora: r.fin, ruta: r.rutaNombre || (ruta ? ruta.nombre : "—"),
            guardia: r.guardiaNombre || (g ? g.nombre : "—"), guardiaId: r.guardiaId, rutaId: r.rutaId,
            punto: p.nombre, codigo: p.codigo, zona: p.zona, estado: "omitido", desfase: null,
            metodo: "—", novedad: false, nota: "Punto no marcado durante la ronda.",
            geo: null, coords: null, fotos: [] });
        }
      });
    }
  });
  return filas.sort((a, b) => new Date(b.hora) - new Date(a.hora));
}

function bitacoraFiltrada() {
  const f = state.filtros;
  const desde = f.dias === "todo" ? null : new Date(Date.now() - parseInt(f.dias, 10) * 864e5);
  return bitacora().filter(x =>
    (!desde || new Date(x.hora) >= desde) &&
    (!f.guardia || x.guardiaId === f.guardia) &&
    (!f.ruta || x.rutaId === f.ruta) &&
    (!f.soloNovedades || x.novedad || x.estado === "omitido"));
}

/* ================= FOTOS =================
   Las fotos no caben en localStorage (unos 5 MB en total), así que van a
   IndexedDB, que admite bastante más. En la marca sólo se guarda el id. */
const FOTO_DB = "ronda_vigia_fotos";
let _fdb = null;

function fotosDB() {
  if (_fdb) return _fdb;
  _fdb = new Promise((ok, falla) => {
    let req;
    try { req = indexedDB.open(FOTO_DB, 1); }
    catch (e) { falla(e); return; }
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains("fotos")) d.createObjectStore("fotos", { keyPath: "id" });
    };
    req.onsuccess = () => ok(req.result);
    req.onerror = () => falla(req.error);
  });
  return _fdb;
}

async function fotoGuardar(id, blob, meta) {
  const d = await fotosDB();
  return new Promise((ok, falla) => {
    const tx = d.transaction("fotos", "readwrite");
    tx.objectStore("fotos").put(Object.assign({ id, blob }, meta || {}));
    tx.oncomplete = () => ok(id);
    tx.onerror = () => falla(tx.error);
  });
}

async function fotoLeer(id) {
  try {
    const d = await fotosDB();
    return await new Promise((ok, falla) => {
      const r = d.transaction("fotos", "readonly").objectStore("fotos").get(id);
      r.onsuccess = () => ok(r.result || null);
      r.onerror = () => falla(r.error);
    });
  } catch (e) { return null; }
}

async function fotoBorrar(id) {
  try {
    const d = await fotosDB();
    await new Promise(ok => {
      const tx = d.transaction("fotos", "readwrite");
      tx.objectStore("fotos").delete(id);
      tx.oncomplete = ok; tx.onerror = ok;
    });
  } catch (e) { /* nada que borrar */ }
}

async function fotoTodas() {
  try {
    const d = await fotosDB();
    return await new Promise((ok, falla) => {
      const r = d.transaction("fotos", "readonly").objectStore("fotos").getAll();
      r.onsuccess = () => ok(r.result || []);
      r.onerror = () => falla(r.error);
    });
  } catch (e) { return []; }
}

/* Reduce la foto antes de guardarla: una ronda completa con fotos de 4 MB
   llenaría el teléfono en pocos turnos. */
const FOTO_LADO = 1024, FOTO_CALIDAD = 0.6;

function comprimirFoto(file) {
  return new Promise((ok, falla) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const esc = Math.min(1, FOTO_LADO / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * esc));
      const h = Math.max(1, Math.round(img.height * esc));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? ok(b) : falla(new Error("sin blob")), "image/jpeg", FOTO_CALIDAD);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falla(new Error("imagen ilegible")); };
    img.src = url;
  });
}

const urlsVivas = new Set();
function urlDeBlob(blob) {
  const u = URL.createObjectURL(blob);
  urlsVivas.add(u);
  return u;
}
function soltarUrls() {
  urlsVivas.forEach(u => { try { URL.revokeObjectURL(u); } catch (e) {} });
  urlsVivas.clear();
}

function blobABase64(blob) {
  return new Promise(ok => {
    const r = new FileReader();
    r.onloadend = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => ok("");
    r.readAsDataURL(blob);
  });
}
function base64ABlob(b64, tipo) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: tipo || "image/jpeg" });
}

/* ================= UBICACIÓN ================= */
function ubicar() {
  return new Promise((ok, falla) => {
    if (!navigator.geolocation) { falla(new Error("El dispositivo no entrega ubicación.")); return; }
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6),
                precision: Math.round(p.coords.accuracy || 0), hora: new Date().toISOString() }),
      e => falla(new Error(e.code === 1 ? "Permiso de ubicación denegado." : "No se pudo obtener la ubicación.")),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 15000 });
  });
}
const geoTxt = g => g ? g.lat.toFixed(5) + ", " + g.lon.toFixed(5) + (g.precision ? " (±" + g.precision + " m)" : "") : "";
const geoMapa = g => g ? "https://www.google.com/maps?q=" + g.lat + "," + g.lon : "";
function geoHtml(g) {
  if (!g) return "";
  return '<span class="geo">📍 <a href="' + geoMapa(g) + '" target="_blank" rel="noopener">' + esc(geoTxt(g)) + "</a></span>";
}

/* ================= LECTOR QR ================= */
/* Las bibliotecas van junto a la app, no en un CDN: así el lector funciona sin
   conexión y el worker de qr-scanner resuelve su ruta relativa, cosa que desde
   otro dominio falla por origen cruzado. En la versión de archivo único no
   existen y sólo queda el lector nativo o escribir el código. */
const QRGEN_LOCAL = "qrcode.min.js";
const QRGEN_CDN = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.5.2/qrcode.min.js";
const QRSCAN_LOCAL = "qr-scanner.umd.min.js";

const guiones = {};
function cargarScript(src) {
  if (guiones[src]) return guiones[src];
  guiones[src] = new Promise((ok, falla) => {
    const s = document.createElement("script");
    s.src = src; s.async = true;
    s.onload = () => ok(true);
    s.onerror = () => { delete guiones[src]; falla(new Error("No se pudo cargar " + src)); };
    document.head.appendChild(s);
  });
  return guiones[src];
}

/* Android usa el lector nativo del navegador; iPhone no lo tiene y cae en qr-scanner.
   Su worker es de otro dominio y no se puede cargar directo, así que se copia a un blob. */
async function motorQR() {
  if ("BarcodeDetector" in window) {
    try {
      const fmts = await window.BarcodeDetector.getSupportedFormats();
      if (fmts.includes("qr_code")) {
        const det = new window.BarcodeDetector({ formats: ["qr_code"] });
        return { tipo: "nativo", leer: async v => {
          const r = await det.detect(v);
          return r && r.length ? r[0].rawValue : null;
        } };
      }
    } catch (e) { /* sigue al respaldo */ }
  }
  await cargarScript(QRSCAN_LOCAL);
  const QS = window.QrScanner;
  if (!QS) throw new Error("No se pudo cargar el lector de códigos.");
  const lienzo = document.createElement("canvas");
  return { tipo: "respaldo", leer: async v => {
    if (!v.videoWidth) return null;
    lienzo.width = v.videoWidth; lienzo.height = v.videoHeight;
    lienzo.getContext("2d").drawImage(v, 0, 0);
    try {
      const r = await QS.scanImage(lienzo, { returnDetailedScanResult: true });
      return r && r.data ? r.data : null;
    } catch (e) { return null; }
  } };
}

/* ================= SERVIDOR (Supabase) =================
   La dirección y la clave pública las pega el administrador en la app y
   quedan en este equipo. La clave "anon" está pensada para vivir en el
   navegador: lo que protege los datos son las reglas del servidor, no
   esconder esta clave. */
const APP_VERSION = "2026-09-09-a";      /* sube esto en cada publicación */
const SRV_LIB_MIN = 200000;              /* la biblioteca correcta pesa ~213 KB; la vieja, ~134 KB */
const SRV_K = "ronda_vigia_servidor";
const SRV_LIB = "supabase.js";
const DOMINIO_USUARIOS = "@rondavigia.app";
let SB = null;

state.srv = { probando: false, chequeos: [], perfil: null, sesion: null };

const correoDe = u => normUsuario(u) + DOMINIO_USUARIOS;

function srvConfig() {
  try { return JSON.parse(localStorage.getItem(SRV_K)) || null; } catch (e) { return null; }
}
function srvGuardarConfig(url, clave) {
  try { localStorage.setItem(SRV_K, JSON.stringify({ url: url.replace(/\/+$/, ""), clave })); } catch (e) {}
  SB = null;
}
function srvOlvidar() {
  try { localStorage.removeItem(SRV_K); } catch (e) {}
  SB = null;
  state.srv = { probando: false, chequeos: [], perfil: null, sesion: null };
}

async function srvCliente() {
  const c = srvConfig();
  if (!c || !c.url || !c.clave) return null;
  if (SB) return SB;
  await cargarScript(SRV_LIB);
  if (!window.supabase || !window.supabase.createClient) throw new Error("No se pudo cargar la biblioteca del servidor.");
  SB = window.supabase.createClient(c.url, c.clave, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "rv_auth" }
  });
  return SB;
}

/* Los errores de PostgREST a veces llegan con message vacío; se arma un
   detalle con lo que haya para no dejar una fila roja sin explicación. */
function detalleError(e) {
  if (!e) return "error sin descripción";
  const partes = [e.code, e.message, e.details, e.hint].filter(x => x && String(x).trim());
  if (partes.length) return partes.join(" · ");
  try { return JSON.stringify(e).slice(0, 160); } catch (x) { return String(e); }
}
const errorDeClave = e => /Invalid Compact JWS|Invalid API key|JWSError|JWT|apikey/i.test(detalleError(e));

/* Cada comprobación devuelve {nombre, ok, detalle}. ok === null es informativo:
   ni bien ni mal, sólo estado. */
async function srvDiagnostico() {
  const out = [];
  const paso = (nombre, ok, detalle) => { out.push({ nombre, ok, detalle: detalle || "" }); return ok; };

  const c = srvConfig();
  if (!c) { paso("Configuración", false, "Falta la dirección o la clave."); return out; }
  paso("Configuración", true, c.url);

  /* Forma de la clave, sin mostrarla: casi todos los fallos son un pegado
     incompleto o haberse traído la clave equivocada. */
  const k = String(c.clave || "");
  const prefijo = k.startsWith("sb_publishable_") ? "sb_publishable_ (formato nuevo)"
                : k.startsWith("sb_secret_") ? "sb_secret_ — ¡es la clave SECRETA! usa la publishable"
                : k.startsWith("eyJ") ? "eyJ… (formato antiguo)"
                : "formato no reconocido";
  const truncada = /[…]|\.\.\.$/.test(k) || k.length < 30;
  paso("Forma de la clave", !truncada && !k.startsWith("sb_secret_"),
       prefijo + " · " + k.length + " caracteres" +
       (truncada ? " — parece cortada, usa el botón « Copy API key » en vez de seleccionar el texto" : ""));

  paso("Versión de la app", true, APP_VERSION);

  /* ¿Está corriendo la biblioteca nueva o quedó la vieja en la caché?
     La vieja no entiende las claves sb_publishable_ y da errores engañosos. */
  try {
    const resp = await fetch(SRV_LIB + "?v=" + APP_VERSION, { cache: "no-store" });
    const txt = await resp.text();
    const nueva = txt.length >= SRV_LIB_MIN;
    paso("Biblioteca actualizada", nueva,
      Math.round(txt.length / 1024) + " KB — " + (nueva
        ? "correcta"
        : "es la versión antigua, guardada en la caché. Pulsa « Forzar actualización » aquí abajo."));
    if (!nueva) return out;
  } catch (e) {
    paso("Biblioteca actualizada", false, detalleError(e));
  }

  let sb;
  try {
    sb = await srvCliente();
    paso("Biblioteca del servidor", true, "cargada");
  } catch (e) {
    paso("Biblioteca del servidor", false, e.message);
    return out;
  }

  /* Antes que nada: ¿sirve la clave? Si no, no tiene sentido seguir
     llenando la pantalla de rojos que dicen todos lo mismo. */
  try {
    const { error } = await sb.from("perfiles").select("id").limit(1);
    if (error && errorDeClave(error)) {
      paso("Clave pública", false,
        "El servidor rechaza la clave. Respuesta literal: « " + detalleError(error) +
        " ». Vuelve a copiarla con el botón « Copy API key » en Project Settings → API Keys.");
      return out;
    }
    if (error && /does not exist|schema cache/i.test(detalleError(error))) {
      paso("Clave pública", true, "aceptada");
      paso("Tablas", false, "Faltan las tablas. Ejecuta el guion supabase-esquema.sql en el SQL Editor.");
      return out;
    }
    paso("Clave pública", true, "aceptada");
  } catch (e) {
    paso("Clave pública", false, detalleError(e));
    return out;
  }

  /* Sesión: sin ella no es un fallo, sólo todavía no te has registrado. */
  let usuario = null;
  try {
    const { data } = await sb.auth.getSession();
    usuario = data && data.session ? data.session.user : null;
  } catch (e) { /* sin sesión */ }
  paso("Sesión en el servidor", usuario ? true : null,
       usuario ? usuario.email : "todavía sin sesión — usa « Crear mi cuenta » aquí abajo");
  state.srv.sesion = usuario;

  /* Tablas: si no existe, PostgREST lo dice. Si existe pero las reglas no
     dejan ver nada, devuelve vacío sin error, que también es correcto. */
  for (const t of ["instalaciones", "puntos", "rutas", "rondas", "perfiles", "accesos"]) {
    try {
      const { error } = await sb.from(t).select("id").limit(1);
      if (error) paso("Tabla " + t, false, detalleError(error));
      else paso("Tabla " + t, true, "existe y responde");
    } catch (e) {
      paso("Tabla " + t, false, detalleError(e));
    }
  }

  /* Perfil y rol */
  if (usuario) {
    try {
      const { data, error } = await sb.from("perfiles").select("*").eq("id", usuario.id).maybeSingle();
      if (error) paso("Tu perfil", false, error.message);
      else if (!data) paso("Tu perfil", false, "no se creó el perfil (revisa el disparador del guion)");
      else {
        state.srv.perfil = data;
        const esAdm = data.rol === "admin";
        paso("Tu rol", esAdm, data.rol === "pendiente"
          ? "pendiente — ejecuta el apartado 7 del guion para hacerte administrador"
          : data.rol);
      }
    } catch (e) { paso("Tu perfil", false, e.message); }
  }

  /* Almacenamiento de fotos */
  try {
    const { error } = await sb.storage.from("fotos").list("", { limit: 1 });
    if (error) paso("Almacén de fotos", false, detalleError(error));
    else paso("Almacén de fotos", true, "bucket accesible");
  } catch (e) {
    paso("Almacén de fotos", false, detalleError(e));
  }

  return out;
}

async function srvRegistrar(nombre, usuario, clave) {
  const sb = await srvCliente();
  if (!sb) throw new Error("Falta configurar el servidor.");
  const { data, error } = await sb.auth.signUp({
    email: correoDe(usuario), password: clave,
    options: { data: { nombre, usuario: normUsuario(usuario) } }
  });
  if (error) throw new Error(traducirErrorSrv(error.message));
  if (!data.session) {
    /* Con la confirmación por correo apagada esto no debería pasar. */
    throw new Error("La cuenta se creó pero el servidor no inició sesión. Revisa que « Confirm email » esté apagado.");
  }
  return data.user;
}

async function srvEntrar(usuario, clave) {
  const sb = await srvCliente();
  if (!sb) throw new Error("Falta configurar el servidor.");
  const { data, error } = await sb.auth.signInWithPassword({ email: correoDe(usuario), password: clave });
  if (error) throw new Error(traducirErrorSrv(error.message));
  return data.user;
}

async function srvSalir() {
  const sb = await srvCliente();
  if (sb) await sb.auth.signOut();
  state.srv.sesion = null;
  state.srv.perfil = null;
}

function traducirErrorSrv(m) {
  const s = String(m || "");
  if (/Invalid login credentials/i.test(s)) return "Usuario o clave incorrectos.";
  if (/already registered|already been registered/i.test(s)) return "Ese usuario ya está registrado.";
  if (/Password should be at least/i.test(s)) return "La clave es demasiado corta (mínimo 6 caracteres).";
  if (/Email address .* is invalid/i.test(s)) return "El usuario sólo puede llevar letras, números, punto o guion.";
  if (/Signups not allowed/i.test(s)) return "El servidor tiene el registro desactivado (Allow new users to sign up).";
  if (/Failed to fetch|NetworkError/i.test(s)) return "No se llega al servidor. Revisa la dirección y tu conexión.";
  if (/Invalid API key|JWT/i.test(s)) return "La clave pública no es válida para este proyecto.";
  return s;
}

      if (c1 !== c2) { err("Las dos claves no coinciden."); return; }

      await guardar("usuarios", u);
      cap.hidden = true;
      abrirSesion(u);
      avisar("Administrador creado. Ya puedes dar de alta guardias y clientes.", "hv");
    };
    $("#acNombre").focus();
  }
}

/* ---------------- render ---------------- */
let tickT = null;
function render() {
  const act = document.activeElement;
  const foco = act && act.id ? { id: act.id, ini: act.selectionStart, fin: act.selectionEnd } : null;
  soltarUrls();   /* las miniaturas del repintado anterior ya no se usan */

  /* Sin sesión no se pinta nada del interior. */
  if (!state.sesion) { if (state.resuelto) pintarAcceso(); return; }
  $("#acceso").hidden = true;

  pintarSesion();
  renderRonda();
  renderTurno();
  renderBitacora();
  renderReportes();
  renderConfig();

  const nov = bitacora().filter(x => (x.novedad || x.estado === "omitido") && new Date(x.hora) >= new Date(Date.now() - 7 * 864e5)).length;
  const b = $("#bdgNov");
  b.textContent = nov;
  b.className = "badge" + (nov ? " alert" : "");

  if (foco) {
    const el = document.getElementById(foco.id);
    if (el && el.focus) {
      el.focus();
      if (foco.ini != null && el.setSelectionRange) { try { el.setSelectionRange(foco.ini, foco.fin); } catch (e) {} }
    }
  }
  clearTimeout(tickT);
  if (rondaActiva()) tickT = setTimeout(renderRonda, 30000);
}

function bloqueado() { return !state.resuelto; }

/* Qué pestañas ve cada rol. El cliente no marca; el guardia no configura. */
const PERMISOS = {
  admin:   ["ronda", "bitacora", "reportes", "config"],
  guardia: ["ronda", "bitacora"],
  cliente: ["bitacora", "reportes"]
};

function pintarSesion() {
  const u = state.sesion;
  const permitidas = instalacionesDe(u);

  /* selector de instalación (o el nombre, si sólo tiene una) */
  const cont = $("#sitio");
  if (permitidas.length > 1) {
    cont.innerHTML = '<select class="selinst" id="selInst" aria-label="Instalación">' +
      permitidas.map(i => '<option value="' + i.id + '"' + (i.id === state.instalacionId ? " selected" : "") + ">" +
        esc(i.nombre) + "</option>").join("") + "</select>";
    $("#selInst").onchange = e => { state.instalacionId = e.target.value; render(); };
  } else {
    const i = instalacionActual();
    cont.textContent = i ? i.nombre : (permitidas.length ? permitidas[0].nombre : "Sin instalación");
  }

  const r = ROLES[u.rol] || { txt: u.rol };
  $("#sesion").innerHTML =
    '<div class="quien"><b>' + esc(u.nombre) + "</b><span>" + esc(r.txt) + "</span></div>" +
    '<button class="btn btn-sm" id="btnSalir">Salir</button>';
  $("#btnSalir").onclick = cerrarSesion;

  /* pestañas según el rol */
  const puede = PERMISOS[u.rol] || [];
  $$(".tab").forEach(t => {
    const v = t.id.replace("tab-", "");
    t.hidden = !puede.includes(v);
  });
  if (!puede.includes(state.vista)) state.vista = puede[0] || "bitacora";
  $$(".tab").forEach(t => t.setAttribute("aria-selected", String(t.id === "tab-" + state.vista)));
  $$(".view").forEach(v => v.hidden = v.id !== "v-" + state.vista);
}

/* ----- vista Ronda ----- */
function renderRonda() {
  const cont = $("#colRonda");
  const r = rondaActiva();
  if (!r) { cont.innerHTML = panelInicio(); wireInicio(); return; }

  const ruta = byId(state.rutas, r.rutaId);
  const pts = puntosDeRuta(ruta);
  const tol = ruta ? (ruta.toleranciaMin || 5) : 5;
  const estricto = ruta ? !!ruta.ordenEstricto : false;
  const sig = proximoIdx(r, ruta);
  const res = resumenRonda(r);
  const trans = minutos(r.inicio, new Date());
  const hh = String(Math.floor(trans / 60)).padStart(2, "0"), mm = String(trans % 60).padStart(2, "0");

  let lista = "";
  pts.forEach(p => {
    const m = marcaEnIdx(r, p.idx);
    const esSig = p.idx === sig;
    const cls = m ? "pt done" : (esSig ? "pt next" : "pt");
    let der = "";
    if (m) {
      der = '<div><div class="pt-hora mono">' + fmtHora(m.hora) + "</div>" +
            '<div class="pt-sub" style="justify-content:flex-end">' + (m.desfase > 0 ? "+" : "") + m.desfase + " min</div></div>" +
            chipEstado(m.estado) + (m.novedad ? '<span class="chip bad">Novedad</span>' : "");
    } else {
      const dis = (estricto && !esSig) || bloqueado();
      der = '<button class="btn btn-sm ' + (esSig ? "btn-hv" : "") + '" data-marcar="' + p.idx + '"' + (dis ? " disabled" : "") + '>' +
            (esSig ? "Marcar" : "Marca manual") + "</button>";
    }
    lista += '<li class="' + cls + '">' +
      '<span class="pt-n">' + (p.idx + 1) + "</span>" +
      '<div><div class="pt-nom">' + esc(p.nombre) + '<span class="pt-code">' + esc(p.codigo) + "</span>" +
      (m && m.metodo === "manual" ? '<span class="chip warn">Manual</span>' : "") + "</div>" +
      '<div class="pt-sub"><span>' + esc(p.zona) + "</span><span>Programado: min " + p.minuto + "</span>" +
      (m ? geoHtml(m.geo) || (m.coords ? "<span>📍 " + esc(m.coords) + "</span>" : "") : "") + "</div></div>" +
      '<div class="pt-act">' + der + "</div>" +
      (m && m.nota ? '<div class="pt-nota' + (m.novedad ? " novedad" : "") + '">' + esc(m.nota) + "</div>" : "") +
      (m && (m.fotos || []).length
        ? '<div class="pt-fotos fotos">' + m.fotos.map(fid =>
            '<button class="foto-mini" data-foto="' + fid + '" data-pie="' + esc(p.codigo + " " + p.nombre) + '" aria-label="Ver foto"></button>').join("") + "</div>"
        : "") +
      "</li>";
  });

  cont.innerHTML =
    '<div class="panel activa">' +
      '<div class="activa-hd">' +
        "<div><h2>" + esc(ruta ? ruta.nombre : "Ruta eliminada") + "</h2>" +
          '<div class="activa-meta"><span>Guardia <b>' + esc(r.guardiaNombre) + "</b></span>" +
          "<span>Inicio <b class=\"mono\">" + fmtHora(r.inicio) + "</b></span>" +
          "<span>Tolerancia <b>&plusmn;" + tol + " min</b></span>" +
          (estricto ? "<span><b>Orden estricto</b></span>" : "<span>Orden libre</span>") + "</div></div>" +
        '<div class="timer"><div class="t mono">' + hh + ":" + mm + '</div><div class="eyebrow">Transcurrido</div></div>' +
        '<div class="progress" aria-hidden="true"><i style="width:' + pct(res.marcadas, res.total) + '%"></i></div>' +
        '<div class="eyebrow" style="width:100%">' + res.marcadas + " de " + res.total + " puntos marcados" +
          (res.novedades ? " &middot; " + res.novedades + " con novedad" : "") + "</div>" +
      "</div>" +
      '<div class="scan">' +
        '<button class="btn btn-hv btn-lg btn-qr" id="btnQR"' + (bloqueado() ? " disabled" : "") + ">▣ Escanear QR</button>" +
        '<label class="f" for="codigoIn">o escribe el código' +
          '<input id="codigoIn" placeholder="PC-00" autocomplete="off" spellcheck="false"' + (bloqueado() ? " disabled" : "") + "></label>" +
        '<button class="btn btn-lg" id="btnScan"' + (bloqueado() ? " disabled" : "") + ">Registrar</button>" +
        '<button class="btn" id="btnFin">Cerrar ronda</button>' +
      "</div>" +
      '<ul class="pts">' + lista + "</ul>" +
    "</div>";

  const inp = $("#codigoIn");
  $("#btnScan").onclick = () => registrarPorCodigo();
  $("#btnQR").onclick = () => dlgEscanear();
  inp.addEventListener("keydown", e => { if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); registrarPorCodigo(); } });
  $("#btnFin").onclick = () => dlgFinalizar(r);
  $$("[data-marcar]", cont).forEach(b => b.onclick = () => {
    const idx = parseInt(b.dataset.marcar, 10);
    const p = pts.find(x => x.idx === idx);
    dlgMarcar(r, ruta, p, idx === sig ? "codigo" : "manual");
  });
  pintarMiniaturas(cont);
}

/* Las miniaturas viven en IndexedDB, así que se cargan después de pintar. */
function pintarMiniaturas(raiz) {
  $$("[data-foto]", raiz).forEach(async b => {
    if (b.dataset.listo) return;
    b.dataset.listo = "1";
    b.onclick = () => verFoto(b.dataset.foto, b.dataset.pie);
    const f = await fotoLeer(b.dataset.foto);
    if (!f) { b.textContent = "✕"; b.title = "Foto no disponible en este equipo"; return; }
    const img = document.createElement("img");
    img.src = urlDeBlob(f.blob);
    img.alt = "Foto de " + (b.dataset.pie || "punto");
    b.appendChild(img);
  });
}

async function exportarCsv() {
  const filas = bitacoraFiltrada();
  const cab = ["Fecha", "Hora", "Punto", "Codigo", "Zona", "Ruta", "Guardia", "Estado", "Desfase_min", "Registro",
               "Novedad", "Fotos", "Latitud", "Longitud", "Precision_m", "Mapa", "Observacion"];
  const q = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const cuerpo = filas.map(x => [fmtFC(x.hora), fmtHora(x.hora), x.punto, x.codigo, x.zona, x.ruta, x.guardia,
    (ESTADOS[x.estado] || {}).txt || x.estado, x.desfase == null ? "" : x.desfase, x.metodo,
    x.novedad ? "Si" : "No", (x.fotos || []).length,
    x.geo ? x.geo.lat : "", x.geo ? x.geo.lon : "", x.geo ? x.geo.precision : "", x.geo ? geoMapa(x.geo) : "",
    x.nota].map(q).join(";"));
  const csv = "﻿" + cab.join(";") + "\n" + cuerpo.join("\n");
  const ok = await descargar("bitacora-rondas-" + hoyKey() + ".csv", csv, "text/csv;charset=utf-8");
  if (ok) avisar("Bitácora exportada (" + filas.length + " marcas).");
}

/* Dentro de Claude la descarga pasa por la capacidad "downloads"; alojada en un sitio
   propio no existe window.claude y se usa el mecanismo normal del navegador. */
const puedeDescargar = () => !!DOWN || !window.claude;

async function descargar(nombre, texto, tipo) {
  if (DOWN) {
    try { await DOWN.save({ filename: nombre, data: texto }); return true; }
    catch (e) { avisar("La descarga no se completó.", "bad"); return false; }
  }
  if (window.claude) { avisar("La descarga no está disponible en esta vista.", "bad"); return false; }
  try {
    const blob = new Blob([texto], { type: tipo });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 0);
    return true;
  } catch (e) { avisar("El navegador bloqueó la descarga.", "bad"); return false; }
}

/* ----- Reportes ----- */
function renderReportes() {
  const dias = state.repDias;
  const desde = new Date(Date.now() - dias * 864e5);
  const rondas = rondasVis().filter(r => new Date(r.inicio) >= desde);
  let esperadas = 0, marcadas = 0, aTiempo = 0, novedades = 0, omitidos = 0;
  rondas.forEach(r => { const s = resumenRonda(r); esperadas += s.total; marcadas += s.marcadas; aTiempo += s.aTiempo; novedades += s.novedades; omitidos += s.omitidos; });
  const cumpl = pct(marcadas, esperadas);
  const punt = pct(aTiempo, marcadas);

  /* serie diaria de cumplimiento */
  const serie = [];
  for (let i = dias - 1; i >= 0; i--) {
    const d = new Date(Date.now() - i * 864e5);
    const k = diaKey(d);
    const rs = rondasVis().filter(r => diaKey(r.inicio) === k);
    let e = 0, m = 0;
    rs.forEach(r => { const s = resumenRonda(r); e += s.total; m += s.marcadas; });
    serie.push({ k, fecha: d, val: e ? pct(m, e) : null, rondas: rs.length, marcadas: m, esperadas: e });
  }

  /* por guardia */
  const porG = {};
  rondas.forEach(r => {
    const k = r.guardiaId || "—";
    porG[k] = porG[k] || { nombre: r.guardiaNombre || "—", rondas: 0, esperadas: 0, marcadas: 0, aTiempo: 0, novedades: 0 };
    const s = resumenRonda(r);
    porG[k].rondas++; porG[k].esperadas += s.total; porG[k].marcadas += s.marcadas;
    porG[k].aTiempo += s.aTiempo; porG[k].novedades += s.novedades;
  });
  const listaG = Object.values(porG).sort((a, b) => pct(b.marcadas, b.esperadas) - pct(a.marcadas, a.esperadas));

  /* puntos más omitidos */
  const omit = {};
  bitacora().filter(x => new Date(x.hora) >= desde && x.estado === "omitido").forEach(x => {
    const k = x.codigo + "|" + x.punto;
    omit[k] = (omit[k] || 0) + 1;

function barPath(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  if (h <= 0) return "";
  return "M" + x + "," + (y + h) + "V" + (y + r) + "A" + r + "," + r + " 0 0 1 " + (x + r) + "," + y +
         "H" + (x + w - r) + "A" + r + "," + r + " 0 0 1 " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
}

function barras(serie) {
  const W = 760, H = 210, ml = 36, mr = 10, mt = 12, mb = 30;
  const pw = W - ml - mr, ph = H - mt - mb;
  const n = serie.length || 1;
  const paso = pw / n, gap = Math.min(8, paso * 0.28), bw = Math.max(4, paso - gap);
  let g = "";
  [0, 50, 100].forEach(v => {
    const y = mt + ph - (v / 100) * ph;
    g += '<line class="gridline" x1="' + ml + '" y1="' + y + '" x2="' + (W - mr) + '" y2="' + y + '"></line>' +
         '<text class="axis-t" x="' + (ml - 8) + '" y="' + (y + 4) + '" text-anchor="end">' + v + "</text>";
  });
  let b = "", hits = "", lab = "";
  serie.forEach((d, i) => {
    const x = ml + i * paso + gap / 2;
    const v = d.val == null ? 0 : d.val;
    const h = (v / 100) * ph;
    const y = mt + ph - h;
    b += '<path class="bar-bg" d="' + barPath(x, mt, bw, ph, 3) + '" opacity=".38"></path>';
    if (d.val != null && h > 0) b += '<path class="bar" id="bar' + i + '" d="' + barPath(x, y, bw, h, 3) + '"></path>';
    hits += '<rect class="hit" data-i="' + i + '" x="' + (ml + i * paso) + '" y="' + mt + '" width="' + paso + '" height="' + ph + '"></rect>';
    const paso2 = Math.ceil(serie.length / 8);
    if (i % paso2 === 0 || i === serie.length - 1) {
      lab += '<text class="axis-t" x="' + (x + bw / 2) + '" y="' + (mt + ph + 18) + '" text-anchor="middle">' +
        String(d.fecha.getDate()).padStart(2, "0") + "/" + String(d.fecha.getMonth() + 1).padStart(2, "0") + "</text>";
    }
  });
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Cobertura diaria de puntos de control, en porcentaje">' +
    g + b + lab + hits + "</svg>";
}

function wireChart(serie) {
  const wrap = $("#chartWrap"); if (!wrap) return;
  const tip = $("#tip"), svg = wrap.querySelector("svg");
  $$(".hit", wrap).forEach(h => {
    h.addEventListener("mouseenter", () => {
      const d = serie[parseInt(h.dataset.i, 10)];
      const bar = wrap.querySelector("#bar" + h.dataset.i);
      if (bar) bar.style.fill = "var(--navy)";
      tip.innerHTML = "<b>" + String(d.fecha.getDate()).padStart(2, "0") + "/" + String(d.fecha.getMonth() + 1).padStart(2, "0") + "</b> &middot; " +
        (d.val == null ? "sin rondas" : d.val + "% cobertura<br>" + d.marcadas + " de " + d.esperadas + " puntos &middot; " + d.rondas + " ronda" + (d.rondas === 1 ? "" : "s"));
      const r = h.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      tip.style.left = (r.left - wr.left + r.width / 2) + "px";
      tip.style.top = (r.top - wr.top + r.height * (1 - (d.val || 0) / 100)) + "px";
      tip.style.opacity = "1";
    });
    h.addEventListener("mouseleave", () => {
      const bar = wrap.querySelector("#bar" + h.dataset.i);
      if (bar) bar.style.fill = "";
      tip.style.opacity = "0";
    });
  });
  if (svg) svg.addEventListener("mouseleave", () => { tip.style.opacity = "0"; });
}

/* Etiquetas QR para imprimir y pegar en cada punto: sin ellas el lector no
   sirve de nada, porque no hay qué escanear. */
async function dlgEtiquetas() {
  const activos = puntosVis().filter(p => p.activo);
  if (!activos.length) { avisar("No hay puntos de control activos.", "bad"); return; }
  abrirDlg('<div class="dlg-hd"><h3>Etiquetas QR</h3></div>' +
    '<div class="dlg-bd"><p style="margin:0">Se generará una etiqueta por cada uno de los ' + activos.length +
      " puntos activos. Imprímelas, plastifícalas y pégalas en su lugar.</p>" +
      '<p class="hint" style="margin:0">Cada código contiene sólo el identificador del punto (por ejemplo <b>PC-03</b>), ' +
      "nada más. Si repones una etiqueta, basta con reimprimir la misma.</p>" +
      '<p class="hint" id="etqMsg" style="margin:0">Cargando el generador…</p></div>' +
    '<div class="dlg-ft"><button class="btn" data-cerrar>Cancelar</button>' +
      '<button class="btn btn-navy" id="btnEtq" disabled>Generar e imprimir</button></div>');

  try { await cargarScript(QRGEN_LOCAL); }
  catch (e1) {
    try { await cargarScript(QRGEN_CDN); }
    catch (e2) { $("#etqMsg").textContent = "No se pudo cargar el generador de códigos. Necesitas conexión la primera vez."; return; }
  }
  if (!window.qrcode) { $("#etqMsg").textContent = "El generador de códigos no está disponible."; return; }
  $("#etqMsg").textContent = "Generador listo.";
  $("#btnEtq").disabled = false;

  $("#btnEtq").onclick = () => {
    dlg.close();
    const hoja = activos.map(p => {
      const q = window.qrcode(0, "M");
      q.addData(p.codigo.toUpperCase());
      q.make();
      return '<div class="etq">' + q.createSvgTag({ cellSize: 4, margin: 1, scalable: true }) +
        '<div class="cod">' + esc(p.codigo.toUpperCase()) + "</div>" +
        '<div class="nom">' + esc(p.nombre) + "</div>" +
        '<div class="zon">' + esc(p.zona) + "</div>" +
        '<div class="marca">' + esc(state.sitio.nombre || "") + "</div></div>";
    }).join("");

    const v = $("#v-config");
    const previo = v.innerHTML;
    v.innerHTML = '<div class="panel"><div class="panel-hd no-print"><h2>Etiquetas QR</h2><span class="spacer"></span>' +
      '<button class="btn btn-sm" id="etqImp">Imprimir</button>' +
      '<button class="btn btn-sm" id="etqVolver">Volver</button></div>' +
      '<div class="panel-bd"><div class="hoja">' + hoja + "</div></div></div>";
    $("#etqImp").onclick = () => window.print();
    $("#etqVolver").onclick = () => { v.innerHTML = previo; render(); };
    window.scrollTo(0, 0);
    avisar(activos.length + " etiquetas generadas.", "hv");
  };
}

const mb = b => (b / 1048576).toFixed(1) + " MB";
const pesoTxt = b => b < 1048576 ? Math.max(1, Math.round(b / 1024)) + " KB" : (b / 1048576).toFixed(1) + " MB";
const plural = (n, sing, plur) => n + " " + (n === 1 ? sing : plur);

async function mostrarEspacio() {
  const el = $("#espacio");
  if (!el) return;
  const fotos = await fotoTodas();
  const peso = fotos.reduce((s, f) => s + (f.blob ? f.blob.size : 0), 0);
  let txt = plural(fotos.length, "foto guardada", "fotos guardadas") + (peso ? " (" + pesoTxt(peso) + ")" : "");
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const e = await navigator.storage.estimate();
      if (e && e.quota) {
        const pc = Math.round((e.usage / e.quota) * 100);
        txt += " · " + mb(e.usage) + " de " + mb(e.quota) + " usados en este equipo (" + pc + "%)";
        if (pc >= 80) txt += ". Conviene descargar un respaldo y liberar espacio.";
      }
    }
  } catch (err) { /* el navegador no informa la cuota */ }
  el.textContent = txt;
}

function dlgRestaurar(file) {
  const lector = new FileReader();
  lector.onerror = () => avisar("No se pudo leer el archivo.", "bad");
  lector.onload = () => {
    let d = null;
    try { d = JSON.parse(lector.result); } catch (e) { d = null; }
    if (!d || !Array.isArray(d.puntos) || !Array.isArray(d.guardias) || !Array.isArray(d.rutas) || !Array.isArray(d.rondas)) {
      avisar("Ese archivo no es un respaldo de Ronda Vigía.", "bad");
      return;
    }
    abrirDlg('<div class="dlg-hd"><h3>Restaurar respaldo</h3></div><div class="dlg-bd">' +
      '<div style="padding:12px;background:var(--bad-bg);color:var(--bad);border-radius:var(--r-sm)">' +
        "<b>Esto reemplaza todo lo que hay ahora.</b> La configuración y la bitácora actuales se pierden.</div>" +
      "<p style=\"margin:0\">El respaldo contiene:</p>" +
      '<ul style="margin:0;padding-left:20px;line-height:1.7">' +
        "<li>" + d.puntos.length + " puntos de control</li><li>" + d.rutas.length + " rutas</li>" +
        "<li>" + d.guardias.length + " guardias</li><li>" + d.rondas.length + " rondas registradas</li>" +
        "<li>" + ((d.fotos || []).length ? d.fotos.length + " fotos" : "sin fotos") + "</li></ul>" +
      (d.exportado ? '<p class="hint" style="margin:0">Exportado el ' + fmtFC(d.exportado) + " a las " + fmtHora(d.exportado) + ".</p>" : "") +
      "</div>" +
      '<div class="dlg-ft"><button class="btn" data-cerrar>Cancelar</button>' +
        '<button class="btn btn-danger" id="btnRest">Reemplazar todo</button></div>');
    $("#btnRest").onclick = async () => {
      dlg.close();
      avisar("Restaurando…");
      if (d.sitio && d.sitio.nombre) await guardarSitio(d.sitio.nombre);
      for (const col of COLS) {
        for (const doc of d[col]) { if (doc && doc.id) await guardar(col, doc); }
      }
      let fotosOk = 0;
      for (const f of (d.fotos || [])) {
        if (!f || !f.id || !f.b64) continue;
        try {
          await fotoGuardar(f.id, base64ABlob(f.b64, "image/jpeg"),
            { fecha: f.fecha, rondaId: f.rondaId, puntoId: f.puntoId, codigo: f.codigo });
          fotosOk++;
        } catch (e) { /* espacio insuficiente: se restaura el resto igual */ }
      }
      avisar("Respaldo restaurado" + (fotosOk ? " con " + fotosOk + " fotos." : "."), "hv");
    };
  };
  lector.readAsText(file);
}
