/* Escanea el QR pegado en el punto de control y lo entrega al mismo flujo
   que la escritura manual del código. */
async function dlgEscanear() {
  const r = rondaActiva();
  if (!r) return;
  let stream = null, vivo = true, motor = null;

  const cerrar = () => {
    vivo = false;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
  };

  abrirDlg('<div class="dlg-hd"><h3>Escanear punto</h3></div>' +
    '<div class="dlg-bd"><div class="lector"><video id="qrVideo" playsinline muted></video>' +
      '<div class="mira"></div><div class="lector-msg" id="qrMsg">Pidiendo acceso a la cámara…</div></div>' +
      '<p class="hint" style="margin:0">Apunta al código pegado en el punto. Se registra solo al reconocerlo.</p></div>' +
    '<div class="dlg-ft"><button class="btn" data-cerrar>Cancelar</button></div>');

  dlg.addEventListener("close", cerrar, { once: true });
  const cancelar = dlg.querySelector("[data-cerrar]");
  if (cancelar) cancelar.onclick = () => { cerrar(); dlg.close(); };

  const msg = $("#qrMsg"), video = $("#qrVideo");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false });
    video.srcObject = stream;
    await video.play();
  } catch (e) {
    msg.textContent = e && e.name === "NotAllowedError"
      ? "Permiso de cámara denegado. Puedes escribir el código a mano."
      : "No se pudo abrir la cámara. Puedes escribir el código a mano.";
    return;
  }
  try { motor = await motorQR(); }
  catch (e) { msg.textContent = "El lector no está disponible en este equipo. Escribe el código a mano."; return; }

  msg.textContent = "Buscando código…";
  const pts = puntosDeRuta(byId(state.rutas, r.rutaId));

  (async function bucle() {
    while (vivo && dlg.open) {
      let val = null;
      try { val = await motor.leer(video); } catch (e) { val = null; }
      if (val) {
        const cod = String(val).trim().toUpperCase();
        const conocido = pts.some(p => p.codigo.toUpperCase() === cod);
        if (conocido) {
          cerrar(); dlg.close();
          const inp = $("#codigoIn");
          if (inp) { inp.value = cod; registrarPorCodigo(); }
          return;
        }
        msg.textContent = "Código « " + cod + " » no pertenece a esta ruta.";
      }
      await new Promise(res => setTimeout(res, 220));
    }
  })();
}

/* ---------- visor de fotos ---------- */
async function verFoto(id, pie) {
  const f = await fotoLeer(id);
  if (!f) { avisar("La foto ya no está en este equipo.", "bad"); return; }
  /* URL propia, fuera del pool de miniaturas: un repintado no debe romper el visor. */
  const url = URL.createObjectURL(f.blob);
  const cap = document.createElement("div");
  cap.className = "visor";
  cap.innerHTML = '<div class="visor-hd"><b>' + esc(pie || "") + "</b>" +
      '<span style="margin-left:auto"></span><button class="btn btn-sm" data-x>Cerrar</button></div>' +
    '<img src="' + url + '" alt="Foto del punto de control">' +
    '<div class="visor-ft"><button class="btn btn-sm" data-compartir>Compartir</button>' +
      '<button class="btn btn-sm" data-bajar>Descargar</button>' +
      '<span style="color:#9AA7B4">' + Math.round(f.blob.size / 1024) + " KB · " + (f.fecha ? fmtFC(f.fecha) + " " + fmtHora(f.fecha) : "") + "</span></div>";
  document.body.appendChild(cap);
  const quitar = () => { cap.remove(); try { URL.revokeObjectURL(url); } catch (e) {} };
  cap.querySelector("[data-x]").onclick = quitar;
  cap.addEventListener("click", e => { if (e.target === cap) quitar(); });

  const nombre = "ronda-" + (pie || "foto").replace(/[^\w]+/g, "-").toLowerCase() + ".jpg";
  cap.querySelector("[data-compartir]").onclick = async () => {
    const file = new File([f.blob], nombre, { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: pie || "Novedad de ronda", text: pie || "" }); }
      catch (e) { /* el usuario canceló */ }
    } else {
      avisar("Este equipo no permite compartir archivos. Usa Descargar.", "bad");
    }
  };
  cap.querySelector("[data-bajar]").onclick = async () => {
    const b64 = await blobABase64(f.blob);
    const bin = base64ABlob(b64, "image/jpeg");
    if (window.claude) { avisar("La descarga no está disponible en esta vista.", "bad"); return; }
    const u = URL.createObjectURL(bin);
    const a = document.createElement("a");
    a.href = u; a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(u); a.remove(); }, 0);
  };
}

function dlgMarcar(ronda, ruta, punto, metodo) {
  const manual = metodo === "manual";
  abrirDlg(
    '<div class="dlg-hd"><h3>' + (manual ? "Marca manual" : "Registrar punto") + "</h3></div>" +
    '<div class="dlg-bd">' +
      '<div><div class="eyebrow">Punto ' + (punto.idx + 1) + '</div><div style="font-size:19px;font-weight:600">' + esc(punto.nombre) +
        ' <span class="pt-code">' + esc(punto.codigo) + "</span></div>" +
        '<div class="hint">' + esc(punto.zona) + " &middot; programado en el minuto " + punto.minuto + " de la ronda</div></div>" +
      (manual ? '<p class="hint" style="margin:0;padding:10px 12px;background:var(--warn-bg);border-radius:var(--r-sm);color:var(--warn)">' +
        "Se registrará como <b>marca manual</b>: queda marcada en la bitácora porque no se leyó el código del punto. Indica el motivo.</p>" : "") +
      '<div><div class="eyebrow" style="margin-bottom:6px">Estado del punto</div><div class="seg" id="segNov">' +
        '<button type="button" data-nov="0" aria-pressed="true">Sin novedad</button>' +
        '<button type="button" class="nov" data-nov="1" aria-pressed="false">Con novedad</button></div></div>' +
      '<label class="f">Observación' + (manual ? " (obligatoria)" : "") +
        '<textarea id="mNota" placeholder="' + (manual ? "Motivo de la marca manual" : "Opcional: qué se observó en el punto") + '"></textarea></label>' +
      '<div><div class="eyebrow" style="margin-bottom:6px">Fotos <span id="fotoCnt"></span></div>' +
        '<div class="fotos" id="fotoLista"></div>' +
        '<button class="btn btn-sm" id="btnFoto" style="margin-top:8px">Tomar foto</button>' +
        '<input type="file" id="fotoIn" accept="image/*" capture="environment" multiple hidden></div>' +
      '<div><button class="btn btn-sm" id="btnGps">Adjuntar ubicación</button> <span class="hint" id="gpsTxt">Sin ubicación</span></div>' +
    "</div>" +
    '<div class="dlg-ft"><button class="btn" data-cerrar>Cancelar</button>' +
      '<button class="btn btn-hv" id="btnOk">Registrar marca</button></div>');

  let novedad = false, geo = null;
  const pendientes = [];               /* {id, blob} aún no confirmadas */
  const MAX_FOTOS = 3;

  $$("#segNov button").forEach(b => b.onclick = () => {
    novedad = b.dataset.nov === "1";
    $$("#segNov button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });

  function pintarFotos() {
    const cont = $("#fotoLista");
    if (!cont) return;
    cont.innerHTML = pendientes.map((f, i) =>
      '<span class="foto-mini"><img src="' + f.url + '" alt="Foto ' + (i + 1) + '">' +
      '<button type="button" class="quita" data-fx="' + i + '" aria-label="Quitar foto ' + (i + 1) + '">&times;</button></span>').join("");
    $$("[data-fx]", cont).forEach(b => b.onclick = () => {
      const i = +b.dataset.fx;
      try { URL.revokeObjectURL(pendientes[i].url); } catch (e) {}
      pendientes.splice(i, 1);
      pintarFotos();
    });
    $("#fotoCnt").textContent = pendientes.length ? "(" + pendientes.length + " de " + MAX_FOTOS + ")" : "";
    const bf = $("#btnFoto");
    if (bf) bf.disabled = pendientes.length >= MAX_FOTOS;
  }
  pintarFotos();

  $("#btnFoto").onclick = () => $("#fotoIn").click();
  $("#fotoIn").onchange = async e => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    for (const f of files) {
      if (pendientes.length >= MAX_FOTOS) { avisar("Máximo " + MAX_FOTOS + " fotos por punto.", "bad"); break; }
      try {
        const blob = await comprimirFoto(f);
        pendientes.push({ id: uid("f"), blob, url: URL.createObjectURL(blob) });
      } catch (err) { avisar("No se pudo procesar la foto.", "bad"); }
    }
    pintarFotos();
  };

  $("#btnGps").onclick = async () => {
    const t = $("#gpsTxt");
    t.textContent = "Obteniendo ubicación…";
    try { geo = await ubicar(); t.textContent = geoTxt(geo); }
    catch (err) { geo = null; t.textContent = err.message; }
  };

  $("#btnOk").onclick = async () => {
    const nota = $("#mNota").value.trim();
    if (manual && !nota) { avisar("Indica el motivo de la marca manual.", "bad"); $("#mNota").focus(); return; }
    const btn = $("#btnOk");
    btn.disabled = true;
    const ids = [];
    for (const f of pendientes) {
      try {
        await fotoGuardar(f.id, f.blob, { fecha: new Date().toISOString(), rondaId: ronda.id, puntoId: punto.puntoId, codigo: punto.codigo });
        ids.push(f.id);
      } catch (err) {
        avisar("No se pudo guardar una foto: el almacenamiento del equipo está lleno.", "bad");
      }
      try { URL.revokeObjectURL(f.url); } catch (e) {}
    }
    registrarMarca(ronda, ruta, punto, { metodo, novedad, nota, geo, fotos: ids });
    dlg.close();
  };
}

  const tramos = (r ? r.puntos || [] : []).map(x => ({ puntoId: x.puntoId, minuto: x.minuto }));
  if (!tramos.length && puntosVis().length) tramos.push({ puntoId: puntosVis()[0].id, minuto: 0 });

  abrirDlg('<div class="dlg-hd"><h3>' + (n ? "Nueva ruta" : "Editar ruta") + "</h3></div>" +

        '<label class="f">Tolerancia (min)<input type="number" min="0" max="60" id="rT" value="' + (r ? r.toleranciaMin || 5 : 5) + '"></label>' +
        '<label class="f chk" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);align-self:flex-end;padding-bottom:10px">' +
          '<input type="checkbox" id="rO"' + (r && r.ordenEstricto ? " checked" : "") + "> Exigir orden estricto</label>" +

        '<div id="tramos" style="display:flex;flex-direction:column;gap:7px"></div>' +
        '<button class="btn btn-sm" id="btnAddTramo" style="margin-top:9px">Agregar tramo</button></div>' +
      '<p class="hint" style="margin:0">El minuto se cuenta desde el inicio de la ronda. Un mismo punto puede aparecer varias veces; los tramos se ordenan por minuto al guardar.</p>' +
    "</div>" +
    '<div class="dlg-ft">' + (n ? "" : '<button class="btn btn-danger" id="btnDel" style="margin-right:auto">Eliminar</button>') +
      '<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-navy" id="btnOk">Guardar</button></div>');

  function pintarTramos() {
    const cont = $("#tramos");
    if (!puntosVis().length) {
      cont.innerHTML = '<p class="hint">Primero registra puntos de control.</p>';
      return;
    }
    cont.innerHTML = tramos.map((t, i) =>
      '<div class="pick"><span class="ord">' + (i + 1) + "</span>" +
      '<select data-tp="' + i + '" aria-label="Punto de control del tramo ' + (i + 1) + '">' +
        puntosVis().map(p => '<option value="' + p.id + '"' + (p.id === t.puntoId ? " selected" : "") + ">" +
          esc(p.codigo) + " &middot; " + esc(p.nombre) + "</option>").join("") + "</select>" +
      '<input type="number" min="0" step="1" data-tm="' + i + '" value="' + t.minuto + '" aria-label="Minuto programado del tramo ' + (i + 1) + '">' +
      '<button type="button" class="btn btn-sm x" data-tx="' + i + '" aria-label="Quitar tramo ' + (i + 1) + '">&times;</button></div>').join("");

    $$("[data-tp]", cont).forEach(s => s.onchange = () => { tramos[+s.dataset.tp].puntoId = s.value; });
    $$("[data-tm]", cont).forEach(i => i.oninput = () => { tramos[+i.dataset.tm].minuto = parseInt(i.value, 10) || 0; });
    $$("[data-tx]", cont).forEach(b => b.onclick = () => { tramos.splice(+b.dataset.tx, 1); pintarTramos(); });
  }
  pintarTramos();

  $("#btnAddTramo").onclick = () => {
    if (!puntosVis().length) { avisar("Primero registra puntos de control.", "bad"); return; }
    const ult = tramos[tramos.length - 1];
    tramos.push({ puntoId: puntosVis()[0].id, minuto: ult ? ult.minuto + 8 : 0 });
    pintarTramos();
  };

  $("#btnOk").onclick = () => {
    const nom = $("#rN").value.trim();
    if (!nom) { avisar("El nombre de la ruta es obligatorio.", "bad"); return; }
    if (!tramos.length) { avisar("La ruta necesita al menos un tramo.", "bad"); return; }
    const puntos = tramos.map(t => ({ puntoId: t.puntoId, minuto: t.minuto }))
      .sort((a, b) => a.minuto - b.minuto);
    guardar("rutas", { id: r ? r.id : uid("r"), instalacionId: r ? r.instalacionId : instalacionEfectiva(),

  const d = $("#btnDel");
  if (d) d.onclick = () => { borrar("rutas", r.id); dlg.close(); avisar("Ruta eliminada."); };
}

function iniciarRonda(guardiaId, rutaId) {
  if (rondaActiva()) { avisar("Ya hay una ronda en curso. Ciérrala antes de iniciar otra.", "bad"); return; }
  const g = byId(state.guardias, guardiaId), rt = byId(state.rutas, rutaId);
  if (!g || !rt) { avisar("Selecciona un guardia y una ruta válidos.", "bad"); return; }
  guardar("rondas", { id: uid("rd"), instalacionId: rt.instalacionId || instalacionEfectiva(),
    rutaId, guardiaId, rutaNombre: rt.nombre, guardiaNombre: g.nombre,
    inicio: new Date().toISOString(), fin: null, estado: "en_curso", totalPuntos: (rt.puntos || []).length,
    marcas: [], observacion: "", abiertaPor: state.sesion ? state.sesion.usuario : "" });
  avisar("Ronda iniciada: " + rt.nombre + ".", "hv");
}

function registrarPorCodigo() {
  const inp = $("#codigoIn");
  const cod = (inp.value || "").trim().toUpperCase();
  if (!cod) { inp.focus(); return; }
  const r = rondaActiva();
  if (!r) return;
  const ruta = byId(state.rutas, r.rutaId);
  const pts = puntosDeRuta(ruta);
  const pend = pts.filter(p => !marcaEnIdx(r, p.idx) && p.codigo.toUpperCase() === cod);

  if (!pend.length) {
    const enRuta = pts.some(p => p.codigo.toUpperCase() === cod);
    avisar(enRuta ? "El punto " + cod + " ya fue marcado en esta ronda." : "El código " + cod + " no pertenece a esta ruta.", "bad");
    inp.select();
    return;
  }
  const sig = proximoIdx(r, ruta);
  const objetivo = pend[0];
  if (ruta.ordenEstricto && objetivo.idx !== sig) {
    const esperado = pts.find(p => p.idx === sig);
    avisar("Orden estricto: corresponde marcar " + esperado.codigo + " " + esperado.nombre + ".", "bad");
    inp.select();
    return;
  }
  inp.value = "";
  dlgMarcar(r, ruta, objetivo, "codigo");
}

function registrarMarca(ronda, ruta, punto, opts) {
  const actual = byId(state.rondas, ronda.id) || ronda;
  if (actual.estado !== "en_curso") { avisar("La ronda ya fue cerrada.", "bad"); return; }
  if (marcaEnIdx(actual, punto.idx)) { avisar("Ese punto ya está marcado.", "bad"); return; }
  const hora = new Date().toISOString();
  const tol = ruta ? (ruta.toleranciaMin || 5) : 5;
  const ev = estadoMarca(actual, punto.minuto, hora, tol);
  const marca = { idx: punto.idx, puntoId: punto.puntoId, codigo: punto.codigo, nombre: punto.nombre, zona: punto.zona,
    minutoEsperado: punto.minuto, hora, estado: ev.estado, desfase: ev.desfase,
    metodo: opts.metodo, novedad: !!opts.novedad, nota: opts.nota || "",
    geo: opts.geo || null, fotos: opts.fotos || [] };
  const nr = Object.assign({}, actual, { marcas: marcasDe(actual).concat([marca]) });
  guardar("rondas", nr);
  const et = (ESTADOS[ev.estado] || {}).txt || ev.estado;
  avisar(punto.codigo + " registrado a las " + fmtHora(hora) + " — " + et + (opts.novedad ? " con novedad" : "") + ".", opts.novedad ? "bad" : "hv");
  const inp = $("#codigoIn"); if (inp) inp.focus();
}

/* ---------------- instalable en el teléfono ----------------
   Sólo fuera de Claude: alojada en un sitio propio, la página se instala
   en la pantalla de inicio de Android e iOS y funciona sin señal. */
let promptInstalar = null;
if (!window.claude) {
  /* El paquete web ya trae estas etiquetas en el <head>; esto sólo cubre
     el archivo suelto, sin duplicar nada. */
  const cab = document.head;
  const poner = (sel, crear) => { if (!cab.querySelector(sel)) cab.appendChild(crear()); };
  poner('link[rel="manifest"]', () => { const e = document.createElement("link"); e.rel = "manifest"; e.href = "manifest.webmanifest"; return e; });
  poner('meta[name="theme-color"]', () => { const e = document.createElement("meta"); e.name = "theme-color"; e.content = "#1B2E45"; return e; });
  poner('link[rel="apple-touch-icon"]', () => { const e = document.createElement("link"); e.rel = "apple-touch-icon"; e.href = "apple-touch-icon.png"; return e; });
  poner('meta[name="apple-mobile-web-app-capable"]', () => { const e = document.createElement("meta"); e.name = "apple-mobile-web-app-capable"; e.content = "yes"; return e; });
  poner('meta[name="apple-mobile-web-app-title"]', () => { const e = document.createElement("meta"); e.name = "apple-mobile-web-app-title"; e.content = "Ronda Vigía"; return e; });

  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); promptInstalar = e;
    const b = $("#btnInstalar"); if (b) b.hidden = false;
  });
  window.addEventListener("appinstalled", () => { const b = $("#btnInstalar"); if (b) b.hidden = true; });
}
$("#btnInstalar").onclick = async () => {
  if (!promptInstalar) return;
  promptInstalar.prompt();
  await promptInstalar.userChoice;
  promptInstalar = null;
  $("#btnInstalar").hidden = true;
};

/* ---------------- arranque ---------------- */
async function arrancar() {
  cargarLocal();
  marcarLink();
  state.resuelto = false;
  render();
  await conectar();
  await migrar();
  if (!state.instalacionId) {
    const primera = state.instalaciones.filter(i => i.activa !== false)[0];
    if (primera) state.instalacionId = primera.id;
  }
  recuperarSesion();
  render();
}
arrancar();
</script>
